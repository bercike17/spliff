# ============================================
# SPLIFF PLUGIN - PARANCSOK LEIRASA
# ============================================

# ---- ADMIN PARANCSOK (spliff.admin jog) ----

# /spliff start       - Elinditja a lobby visszaszamlalast (ezutan mar nem lehet joinolni/leave-elni)
# /spliff stop        - Azonnal leallitja a jatekot, mindenkit visszatelepit
# /spliff reload      - Ujratolti a configot, uzeneteket es jutalmakat
# /spliff reward <nev> - Kezzel adja oda a gyoztes jutalmat a jatekosnak
# /spliff create      - Felépiti a hopalyat a configban megadott meretbol
# /spliff delete      - Kitorli a hopalyat (hoblokkok + piros gyapju)
# /spliff setspawn    - Beallitja a jatek kezdopontjat (ahova a jatekosokat teleportalja)
# /spliff setlobby    - Beallitja a varakozohelyet (a mapon belul, a palya kozeleben)
# /spliff setrespawn  - Beallitja a respawn pontot (leeses utan ide kerulnek vissza)
# /spliff setend      - Beallitja a kiesesi celhelyet (kiesettek ide kerulnek, survival + inventory vissza)

# ---- JATEKOS PARANCSOK (spliff.play jog) ----

# /spliff join        - Csatlakozas a jatekhoz (csak lobby fazisban mukodik)
# /spliff leave       - Kilepes a jatekbol (csak lobby fazisban mukodik)

# ---- Palya epitesi sorrend ----

# 1. /spliff create      -> Jelold ki //wandal
# 2. /spliff setlobby    -> Allj a varakozohelyre
# 3. /spliff setspawn    -> Allj a palya fole (indulasi pont)
# 4. /spliff setrespawn  -> Allj oda, ahova leeses utan kerulnek
# 5. /spliff setend      -> Allj a kiesettek celhelyere
# 6. /spliff create      -> Felepiti a hopalyat
# 7. /spliff start       -> Elinditja a jatekot
# 8. /spliff delete      -> Hogyha ki akarod torollni a mapot
arena:
  spawn:
    world: world
    x: 0
    y: 105
    z: 0
  lobby:
    world: world
    x: 10
    y: 105
    z: 10
  end:
    world: world
    x: 20
    y: 100
    z: 20

game:
  mode: DIG
  auto-remove-percent: 15
  auto-remove-interval: 10
  auto-remove-warning: 3
  min-players: 2
  max-players: 16
  fall-threshold: 80
  give-shovel: true
  shovel-item: "DIAMOND_SHOVEL"
  shovel-slot: 0
  lobby-countdown-seconds: 30
  warmup-seconds: 10

auto-start:
  enabled: false
  interval-minutes: 5
  min-players: 2

command-whitelist:
  enabled: true
  allowed-commands:
    - "/spliff"
    - "/msg"
    - "/tell"
    - "/r"
    - "/help"

rewards:
  enabled: true
  auto-give: true
  commands:
    - "say {player} nyerte a Spliff jatekot!"
  messages:
    - "&aGratulalunk a gyzelemhez!"

messages:
  prefix: "&8[&bSpliff&8] &r"
  no-permission: "&cNincs jogod!"
  unknown-command: "&cIsmeretlen parancs!"
  usage: "&cHasznalat: /spliff <start|stop|reload|reward|create|delete|setspawn|setlobby|setend|join|leave>"
  spawn-set: "&aSpawn pont beallitva!"
  lobby-set: "&aLobby pont beallitva!"
  end-set: "&aKiesesi celpont beallitva!"
  arena-created: "&aArena sikeresen letrehozva a kijelolt teruleten!"
  arena-deleted: "&aArena sikeresen torolve!"
  reload-success: "&aConfig es uzenetek ujratoltve!"
  game-in-progress: "&cA jatek mar folyamatban van!"
  player-joined: "&e{player} &acsatlakozott! &7({count}/{max})"
  player-left: "&e{player} &ckilepett!"
  not-enough-players: "&cNincs eleg jatekos a kezdéshez! Varakozas..."
  lobby-countdown: "&aA jatek &e{seconds} &amp;masodperc mul indul! Csatlakozz most!"
  warmup-start: "&eElokeszules... &7{seconds} masodperc"
  warmup-actionbar: "&eElokeszules: &c{seconds} &emp"
  game-started: "&aA jatek elkezdodott! Sok szerencset!"
  game-mode-info: "&eMod: &f{mode}"
  player-eliminated: "&c{player} &ckiesett!"
  player-won: "&a{player} &anyerte a jatekot!"
  no-winner: "&cNincs nyertes!"
  game-stopped: "&cA jatek leallt!"
  cannot-leave-now: "&cMost mar nem lehet kilepni a jatekbol!"
  dig-only-shovel: "&cCsak asoval torheted a hot!"
  auto-no-break: "&cAuto modban nem torheted ki a blokkokat!"
  command-not-allowed: "&cEz a parancs nem engedelyezett ebben a jatekmodban!"
  pvp-disabled: "&cA PvP ki van kapcsolva!"
  reward-given: "&aJutalom kiosztva: &e{player}"
  reward-received: "&aJutalmat kaptal a gyzelemert!"
  player-not-found: "&cA jatekos nem talalhato!"
  reward-usage: "&cHasznalat: /spliff reward <jatekos>"
  plugin-enabled: "Spliff plugin enabled! Auto-start: {status}"
  lobby-closed: ""
